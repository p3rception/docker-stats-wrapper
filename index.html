<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsw interactive demo</title>
  <meta name="description" content="A static interactive simulation of dsw running against fake container stats.">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="demo-page">
    <div class="demo-header">
      <a class="github-link" href="https://github.com/p3rception/docker-stats-wrapper" target="_blank"
        rel="noopener noreferrer" aria-label="View on GitHub">
        <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
        </svg>
        <span>GitHub</span>
      </a>
    </div>
    <section class="terminal-window" aria-label="Interactive dsw terminal simulation">
      <div class="terminal-titlebar">
        <div class="window-controls" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="titlebar-actions">
          <span class="terminal-subtitle">Compare views</span>
          <div class="view-switch" aria-label="Switch view">
            <button class="view-switch-btn active" id="dswBtn" type="button">dsw</button>
            <button class="view-switch-btn" id="rawBtn" type="button">docker stats</button>
          </div>
        </div>
      </div>

      <div class="terminal-screen" id="terminalScreen" tabindex="0" role="application"
        aria-label="Fake terminal running dsw. Use the keyboard or the key badges."></div>
    </section>
  </main>

  <script src="demo-core.js" defer></script>
  <script src="app.js" defer></script>
</body>

</html>
