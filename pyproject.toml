# dsw is installed without pip (see the Makefile), so this file holds only
# dev-tool configuration: ruff, mypy, and pytest. The version lives in
# dsw/__init__.py.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["dsw"]

[tool.ruff.lint.per-file-ignores]
# Greek/Cyrillic keyboard-layout letters map to Latin hotkeys on purpose;
# the "ambiguous" characters are the whole point of the feature.
"dsw/loops.py" = ["RUF001"]
"tests/test_loops.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
